name: gates

# Fast, deterministic local-quality regression gates for the EasyEDA harness.
# These do NOT need the live EasyEDA bridge: final delivery evidence
# (drc / live-check / deliver) still requires a real EasyEDA editor and is
# intentionally out of CI scope.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  local-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Public install and generic quality gates
        run: npm run ci
